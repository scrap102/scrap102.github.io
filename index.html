<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINISLOP 88</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">MINISLOP 88
      <span class="sub">неевклидова канализация · играбельный скелет</span>
    </div>
    <nav class="tabs">
      <button data-tab="inventory">Инвентарь</button>
      <button data-tab="cases">Кейсы</button>
      <button data-tab="craft">Крафт</button>
      <button data-tab="mecha">Мастерская</button>
      <button data-tab="expedition">Экспедиция</button>
      <button data-tab="shop">Лавка</button>
      <button data-tab="casino">Казино</button>
      <button data-tab="quests">Квесты</button>
      <button data-tab="notifications">Уведомления</button>
      <button data-tab="catalog">Каталог</button>
    </nav>
    <div class="currency">
      <span class="io">Ио: <b id="io-amount">0</b></span>
      <span class="ar">АР: <b id="ar-amount">0</b></span>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="tooltip" class="tooltip hidden"></div>
<script src="game.js" defer></script>
</body>
</html>
